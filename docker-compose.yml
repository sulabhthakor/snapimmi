version: '3.8'

services:
  # 🐘 PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: visa_saas_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: visa_saas
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - visa-network

  # ⚡️ Redis (Queue & Cache)
  redis:
    image: redis:7-alpine
    container_name: visa_saas_redis
    ports:
      - "6381:6379" # Changed to 6381 to avoid conflict with evolution-api
    volumes:
      - redis_data:/data
    networks:
      - visa-network

  # 🗄️ MinIO (S3 Compatible Storage)
  minio:
    image: minio/minio:latest
    container_name: visa_saas_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000" # API (Changed to 9002)
      - "9003:9001" # Console (Changed to 9003)
    volumes:
      - minio_data:/data
    networks:
      - visa-network

  # 📧 Mailpit (Email Testing)
  mailpit:
    image: axllent/mailpit
    container_name: visa_saas_mailpit
    ports:
      - "1026:1025" # SMTP (Changed to 1026)
      - "8026:8025" # UI (Changed to 8026)
    networks:
      - visa-network

  # 🌐 Next.js Application
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visa_saas_app
    ports:
      - "3002:3000"
    restart: always
    env_file:
      - ./code/.env.docker
    depends_on:
      - postgres
      - redis
    networks:
      - visa-network

  # ☁️ Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: visa_saas_cloudflared
    restart: unless-stopped
    command: tunnel run
    volumes:
      - ./cloudflared:/etc/cloudflared
    depends_on:
      - nginx
    networks:
      - visa-network

  nginx:
    image: nginx:alpine
    container_name: visa_saas_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    restart: always
    depends_on:
      - nextjs-app
    networks:
      - visa-network

volumes:
  postgres_data:
  redis_data:
  minio_data:


networks:
  visa-network:
    driver: bridge
